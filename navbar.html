<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .navbar {
            background-color: #e9ecef;
            height: 50px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            list-style: none;
            padding-right: 20px;
        }

        .navbar li {
            margin-right: 20px;
            position: relative;
            list-style: none;
        }

        .navbar li a {
            text-decoration: none;
            margin-left: 5px;
            color: #333;
        }

        .dropdown {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            right: 0;
            top: 30px;
        }

        .navbar li:hover .dropdown {
            display: block;
        }

        .dropdown-content {
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            color: #333;
        }

        .dropdown-content:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li>
                <i class="fas fa-user-circle" style="font-size:24px"></i>
                <a href="#" class="user">Arpita Devi</a>
                <div class="dropdown">
                    <a class="dropdown-content" href="pages/profile.html">Profile</a>
                    <a class="dropdown-content" href="pages/settings.html">Settings</a>
                    <a class="dropdown-content" href="pages/login.html">Logout</a>
                </div>
            </li>
        </ul>
    </nav>
</body>
</html>
