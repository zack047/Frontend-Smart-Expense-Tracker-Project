<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li>
                        <a href="../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a>
                    </li>
                    <li class="active">
                        <a href="expenses.html"><i class="fa fa-list mr-3"></i> Expenses</a>
                    </li>
                    <li>
                        <a href="income.html"><i class="fa fa-plus mr-3"></i> Income</a>
                    </li>
                    <li>
                        <a href="expense-forecast.html"><i class="fa fa-chart-line mr-3"></i> Forecast</a>
                    </li>
                    <li>
                        <a href="pages/goals/list.html"><i class="fa fa-flag mr-3"></i> Goals</a>
                    </li>
                    <li>
                        <a href="pages/profile.html"><i class="fa fa-user mr-3"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="container mt-4">
                <div class="row">
                    <div class="col-md-10">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item">
                                    <a href="expenses.html">Expenses</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">
                                    Edit Expense
                                </li>
                            </ol>
                        </nav>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-danger btn-sm" onclick="confirmDelete()">Delete</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form id="editExpenseForm" onsubmit="handleSubmit(event)">
                            <div class="alert alert-success" role="alert" id="successMessage" style="display: none;">
                                Expense updated successfully!
                            </div>

                            <div class="form-group mb-3">
                                <label for="amount">Amount</label>
                                <input type="text" class="form-control form-control-sm" id="amount" name="amount" value="500" />
                            </div>
                            <div class="form-group mb-3">
                                <label for="description">Description</label>
                                <input type="text" class="form-control form-control-sm" id="description" name="description" 
                                    value="Lunch at office" />
                            </div>
                            <div class="form-group mb-3">
                                <label for="category">Category</label>
                                <input type="text" class="form-control" id="category" name="category" value="Food" />
                            </div>
                            <div class="form-group mb-3">
                                <label for="expense_date">Date of Expense</label>
                                <input type="date" class="form-control form-control-sm" id="expense_date" 
                                    name="expense_date" value="2024-04-01" />
                            </div>

                            <button type="submit" class="btn btn-primary">Save</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });
        });

        function handleSubmit(event) {
            event.preventDefault();
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            // Hide message after 3 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 3000);
        }

        function confirmDelete() {
            if (confirm('Are you sure you want to delete this expense?')) {
                window.location.href = 'expenses.html';
            }
        }
    </script>
</body>
</html>
