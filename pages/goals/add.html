<!DOCTYPE html>
<html>
<head>
    <title>Add Goal - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
    
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li>
                        <a href="../../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a>
                    </li>
                    <li>
                        <a href="../expenses/list.html"><i class="fa fa-list mr-3"></i> Expenses</a>
                    </li>
                    <li class="active">
                        <a href="list.html"><i class="fa fa-flag mr-3"></i> Goals</a>
                    </li>
                    <li>
                        <a href="../stats/index.html"><i class="fa fa-chart-pie mr-3"></i> Statistics</a>
                    </li>
                    <li>
                        <a href="pages/profile.html"><i class="fa fa-user mr-3"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="container p-5">
                <h2>Add Goal</h2>
                <form id="goalForm" onsubmit="handleSubmit(event)">
                    <div class="form-group mt-4">
                        <label for="goalName">Goal Name</label>
                        <input type="text" class="form-control" id="goalName" required>
                    </div>
                    <div class="form-row row">
                        <div class="form-group col-md-6">
                            <label for="startDate">Start Date</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="endDate">End Date</label>
                            <input type="date" class="form-control" id="endDate" required>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label for="amountToSave">Amount to Save</label>
                        <input type="number" class="form-control" id="amountToSave" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Add Goal</button>
                </form>

                <!-- Success Message -->
                <div class="alert alert-success mt-3" id="successMessage" style="display: none;">
                    Goal added successfully!
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });

            // Set minimum date as today for start date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').min = today;

            $("#sidebar-container").load("../../partials/_sidebar.html", function() {
                // Highlight current page in nav
                const currentPath = window.location.pathname;
                $('.nav-link').each(function() {
                    if ($(this).attr('href').includes(currentPath)) {
                        $(this).addClass('active');
                    }
                });
            });
        });

        function handleSubmit(event) {
            event.preventDefault();
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            // Reset form
            document.getElementById('goalForm').reset();
            // Hide message after 3 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
