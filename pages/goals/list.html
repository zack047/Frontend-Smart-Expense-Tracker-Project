<!DOCTYPE html>
<html>
<head>
    <title>Goals - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li>
                        <a href="../../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a>
                    </li>
                    <li>
                        <a href="../expenses.html"><i class="fa fa-list mr-3"></i> Expenses</a>
                    </li>
                    <li>
                        <a href="../income/dashboard.html"><i class="fa fa-plus mr-3"></i> Income</a>
                    </li>
                    <li class="active">
                        <a href="list.html"><i class="fa fa-flag mr-3"></i> Goals</a>
                    </li>
                    <li>
                        <a href="../expense-forecast.html"><i class="fa fa-chart-line mr-3"></i> Forecast</a>
                    </li>
                    <li>
                        <a href="../stats.html"><i class="fa fa-chart-pie mr-3"></i> Statistics</a>
                    </li>
                    <li>
                        <a href="../profile.html"><i class="fa fa-user mr-3"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="container p-5">
                <h2>Goal List</h2>
                
                <!-- Sample Goals -->
                <div id="goal-1" class="goal-card">
                    <h3>Buy a House</h3>
                    <p><strong>Start Date:</strong> 2024-04-01</p>
                    <p><strong>End Date:</strong> 2024-12-31</p>
                    <p><strong>Amount to Save:</strong> ₹ 500,000</p>
                    <p><strong>Current Saved Amount:</strong> ₹ 150,000</p>
                    <div class="progress" style="height: 20px;">
                        <div class="progress-bar" role="progressbar" style="width: 30%;" 
                            aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">
                            30%
                        </div>
                    </div>
                    <p class="mt-2"><strong>Daily Savings Required:</strong> ₹ 1,250</p>

                    <form class="add-amount-form" onsubmit="handleAddAmount(event, 1)">
                        <div class="form-group">
                            <label for="additional_amount_1">Additional Amount</label>
                            <input type="number" class="form-control" id="additional_amount_1" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Add Amount</button>
                    </form>

                    <form class="mt-2" onsubmit="handleDelete(event, 1)">
                        <button type="submit" class="btn btn-danger btn-sm">Delete Goal</button>
                    </form>
                </div>

                <a href="add.html" class="btn btn-primary mt-4">Add Goal</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });
        });

        function handleAddAmount(event, goalId) {
            event.preventDefault();
            alert('Amount added successfully!');
            event.target.reset();
        }

        function handleDelete(event, goalId) {
            event.preventDefault();
            if (confirm('Are you sure you want to delete this goal?')) {
                document.getElementById(`goal-${goalId}`).style.display = 'none';
            }
        }
    </script>
</body>
</html>
