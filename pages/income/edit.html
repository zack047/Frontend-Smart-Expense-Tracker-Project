<!DOCTYPE html>
<html>
<head>
    <title>Edit Income - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li><a href="../../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a></li>
                    <li><a href="../expenses/list.html"><i class="fa fa-list mr-3"></i> Expenses</a></li>
                    <li class="active"><a href="list.html"><i class="fa fa-money mr-3"></i> Income</a></li>
                    <li><a href="../goals/list.html"><i class="fa fa-flag mr-3"></i> Goals</a></li>
                    <li><a href="../stats/index.html"><i class="fa fa-chart-pie mr-3"></i> Statistics</a></li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="container mt-4">
                <!-- Success Message -->
                <div class="alert alert-success" id="successMessage" style="display: none;">
                    Income updated successfully!
                </div>

                <div class="row">
                    <div class="col-md-10">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item">
                                    <a href="list.html">Income</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">
                                    Edit Income
                                </li>
                            </ol>
                        </nav>
                    </div>

                    <div class="col-md-2">
                        <button onclick="handleDelete()" class="btn btn-danger btn-sm">Delete</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form id="editIncomeForm" onsubmit="handleSubmit(event)">
                            <div class="form-group">
                                <label for="amount">Amount</label>
                                <input type="number" class="form-control form-control-sm" id="amount" value="50000" required />
                            </div>
                            <div class="form-group">
                                <label for="description">Description</label>
                                <input type="text" class="form-control form-control-sm" id="description" value="Monthly salary" required />
                            </div>
                            <div class="form-group">
                                <label for="source">Source</label>
                                <select class="form-control" id="source" required>
                                    <option value="Salary" selected>Salary</option>
                                    <option value="Freelancing">Freelancing</option>
                                    <option value="Investments">Investments</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="income_date">Date of Income</label>
                                <input type="date" class="form-control form-control-sm" id="income_date" required />
                            </div>

                            <button type="submit" class="btn btn-primary">Save</button>
                            <a href="list.html" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });

            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('income_date').value = today;
        });

        function handleSubmit(event) {
            event.preventDefault();
            
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            
            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = 'list.html';
            }, 2000);
        }

        function handleDelete() {
            if (confirm('Are you sure you want to delete this income record?')) {
                window.location.href = 'list.html';
            }
        }
    </script>
</body>
</html>
