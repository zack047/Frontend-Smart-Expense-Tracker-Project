<!DOCTYPE html>
<html>
<head>
    <title>Profile - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <style>
        .profile-container {
            height: 100vh;
            width: 80%;
            margin: auto;
            display: flex;
            justify-content: space-between;
        }

        .profile-form {
            height: 100%;
            width: 50%;
            padding: 20px;
            margin: 5%;
        }

        .sources-form {
            height: 50%;
            width: 50%;
            padding: 20px;
            margin: 5%;
            margin-top: 15%;
        }

        .label {
            margin-right: 20px;
            height: auto;
            min-width: 100px;
            display: inline-block;
            margin: auto;
        }

        .list {
            list-style: none;
            padding: 10px 0;
        }

        .list a {
            color: #dc3545;
            margin-left: 10px;
            text-decoration: none;
        }

        @media (max-width: 850px) {
            .profile-container {
                display: block;
            }

            .profile-form,
            .sources-form {
                height: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li>
                        <a href="../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a>
                    </li>
                    <li>
                        <a href="./expenses.html"><i class="fa fa-list mr-3"></i> Expenses</a>
                    </li>
                    <li>
                        <a href="./income/dashboard.html"><i class="fa fa-plus mr-3"></i> Income</a>
                    </li>
                    <li>
                        <a href="./goals/list.html"><i class="fa fa-flag mr-3"></i> Goals</a>
                    </li>
                    <li>
                        <a href="./expense-forecast.html"><i class="fa fa-chart-line mr-3"></i> Forecast</a>
                    </li>
                    <li>
                        <a href="stats.html"><i class="fa fa-chart-pie mr-3"></i> Statistics</a>
                    </li>
                    <li class="active">
                        <a href="profile.html"><i class="fa fa-user mr-3"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="profile-container">
                <!-- Profile Update Form -->
                <form class="profile-form" onsubmit="handleProfileUpdate(event)">
                    <div id="successMessage" class="alert alert-success" style="display: none;">
                        Profile updated successfully!
                    </div>

                    <h3>Welcome Arpita Devi!</h3>

                    <div class="mb-3">
                        <label class="label">Username</label>
                        <input type="text" class="form-control" value="Arpita_Devi" required>
                    </div>

                    <div class="mb-3">
                        <label class="label">Email</label>
                        <input type="email" class="form-control" value="arpita@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="label">Full Name</label>
                        <input type="text" class="form-control" value="Arpita Devi" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Update</button>
                </form>

                <!-- Income Sources Form -->
                <div class="sources-form">
                    <form onsubmit="handleAddSource(event)">
                        <div>Add Income Sources:</div>
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Source" id="sourceInput">
                            <button class="btn btn-primary" type="submit">Add</button>
                        </div>
                    </form>
                    <div id="sourcesList">
                        <div class="list">Salary <a href="#" onclick="deleteSource(this)">Delete</a></div>
                        <div class="list">Freelancing <a href="#" onclick="deleteSource(this)">Delete</a></div>
                        <div class="list">Investments <a href="#" onclick="deleteSource(this)">Delete</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });
        });

        function handleProfileUpdate(event) {
            event.preventDefault();
            document.getElementById('successMessage').style.display = 'block';
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 3000);
        }

        function handleAddSource(event) {
            event.preventDefault();
            const input = document.getElementById('sourceInput');
            if (input.value.trim()) {
                const sourceDiv = document.createElement('div');
                sourceDiv.className = 'list';
                sourceDiv.innerHTML = `${input.value} <a href="#" onclick="deleteSource(this)">Delete</a>`;
                document.getElementById('sourcesList').appendChild(sourceDiv);
                input.value = '';
            }
        }

        function deleteSource(element) {
            if (confirm('Are you sure you want to delete this source?')) {
                element.parentElement.remove();
            }
        }
    </script>
</body>
</html>
