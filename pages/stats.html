<!DOCTYPE html>
<html>
<head>
    <title>Expense Stats - ExpenseWise</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="wrapper d-flex align-items-stretch">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="custom-menu">
                <button type="button" id="sidebarCollapse" class="btn btn-primary">
                    <i class="fa fa-bars"></i>
                    <span class="sr-only">Toggle Menu</span>
                </button>
            </div>
            <div class="p-4">
                <h1><a href="../index.html" class="logo">ExpenseWise</a></h1>
                <ul class="list-unstyled components mb-5">
                    <li>
                        <a href="../index.html"><i class="fa fa-home mr-3"></i> Dashboard</a>
                    </li>
                    <li>
                        <a href="expenses.html"><i class="fa fa-list mr-3"></i> Expenses</a>
                    </li>
                    <li>
                        <a href="./income/dashboard.html"><i class="fa fa-plus mr-3"></i> Income</a>
                    </li>
                    <li>
                        <a href="pages/goals/list.html"><i class="fa fa-flag mr-3"></i> Goals</a>
                    </li>
                    <li>
                        <a href="expense-forecast.html"><i class="fa fa-chart-line mr-3"></i> Forecast</a>
                    </li>
                    <li class="active">
                        <a href="stats.html"><i class="fa fa-chart-pie mr-3"></i> Statistics</a>
                    </li>
                    <li>
                        <a href="profile.html"><i class="fa fa-user mr-3"></i> Profile</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content">
            <div class="container mt-4">
                <div class="row">
                    <div class="col-md-10">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item">
                                    <a href="">Expenses Summary</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">
                                    Summary
                                </li>
                            </ol>
                        </nav>
                    </div>

                    <div class="col-md-2">
                        <a href="../index.html" class="btn btn-primary">BACK</a>
                    </div>
                </div>

                <div class="row m-5">
                    <div class="col-md-8">
                        <canvas id="myChart" width="300" height="300"></canvas>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5>Category Summary</h5>
                            </div>
                            <div class="card-body">
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item d-flex justify-content-between align-items-center">
                                        Food
                                        <span class="badge bg-primary rounded-pill">₹5,000</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between align-items-center">
                                        Transportation
                                        <span class="badge bg-primary rounded-pill">₹3,000</span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between align-items-center">
                                        Bills
                                        <span class="badge bg-primary rounded-pill">₹4,000</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sidebarCollapse').on('click', function() {
                $('#sidebar').toggleClass('active');
            });

            // Initialize Chart
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Food', 'Transportation', 'Bills'],
                    datasets: [{
                        data: [5000, 3000, 4000],
                        backgroundColor: [
                            '#FF6384',
                            '#36A2EB',
                            '#FFCE56'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        title: {
                            display: true,
                            text: 'Expense Distribution'
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
